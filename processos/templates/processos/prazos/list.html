<html><body><a href="{{ url_for('dashboard') }}">Painel</a><h1>Prazos</h1><a href="{{ url_for('prazo_create') }}">Novo prazo</a><form method="get"><select name="status"><option value="">Todos</option>{% for v,l in status_choices %}<option value="{{ v }}" {% if status==v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select><button>Filtrar</button></form>{% for prazo in prazos %}<p><a href="{{ url_for('prazo_detail',pk=prazo.id) }}">{{ prazo.titulo }}</a> — {{ prazo.data_vencimento.strftime('%d/%m/%Y') }} — {{ prazo.processo.numero_cnj }} — {{ prazo.status_display() }} {% if prazo.status=='pendente' %}<form method="post" action="{{ url_for('prazo_concluir',pk=prazo.id) }}" style="display:inline">{{ csrf_token() }}<button>Concluir</button></form>{% endif %}</p>{% else %}<p>Nenhum prazo.</p>{% endfor %}</body></html>
