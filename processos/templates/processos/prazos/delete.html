<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Excluir prazo | Gestão de Processos</title></head>
<body>
<a href="{{ url_for('prazos.detail', pk=prazo.id) }}">Voltar</a>
<h1>Excluir prazo</h1>
<p>Tem certeza que deseja excluir o prazo <strong>{{ prazo.titulo }}</strong>?</p>
<p>O prazo do processo {{ prazo.processo.numero_cnj }} será removido.</p>
<form method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<button type="submit">Confirmar exclusão</button>
</form>
</body>
</html>
