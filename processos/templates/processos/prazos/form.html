<html><body><a href="{{ url_for('prazo_list') }}">Prazos</a><h1>{{ titulo }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p>Processo<select name="processo" required>{% for p in processos %}<option value="{{ p.id }}" {% if (prazo and prazo.processo_id==p.id) or (processo_id==p.id) %}selected{% endif %}>{{ p.numero_cnj }}</option>{% endfor %}</select></p><p>Título<input name="titulo" value="{{ prazo.titulo if prazo else '' }}" required></p><p>Data inicial<input type="date" name="data_inicio" value="{{ prazo.data_inicio.isoformat() if prazo and prazo.data_inicio else '' }}"></p><p>Vencimento<input type="date" name="data_vencimento" value="{{ prazo.data_vencimento.isoformat() if prazo else '' }}" required></p><p>Status<select name="status"><option value="pendente">Pendente</option><option value="concluido">Concluído</option><option value="cancelado">Cancelado</option></select></p><p>Observações<textarea name="observacoes">{{ prazo.observacoes if prazo else '' }}</textarea></p><button>Salvar</button></form></body></html>
