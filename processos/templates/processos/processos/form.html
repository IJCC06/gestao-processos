<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ titulo }}</title><link rel="stylesheet" href="{{ url_for('static', filename='processos/css/app.css') }}"></head><body><main class="page"><div class="topbar"><div><a class="back" href="{{ url_for('processos.detail',pk=processo.id) if processo else url_for('processos.list') }}">← Voltar</a><h1>{{ titulo }}</h1></div></div>{% with mensagens=get_flashed_messages(with_categories=true) %}{% for categoria,mensagem in mensagens %}<div class="alert {{ categoria }}">{{ mensagem }}</div>{% endfor %}{% endwith %}<section class="card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="cliente">Cliente</label><select id="cliente" name="cliente" required>{% for c in clientes %}<option value="{{ c.id }}" {% if valores and valores.cliente|string==c.id|string %}selected{% elif not valores and processo and processo.cliente_id==c.id %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}</select></div><div class="field"><label for="numero_cnj">Número CNJ</label><input id="numero_cnj" name="numero_cnj" value="{{ valores.numero_cnj if valores else (processo.numero_cnj if processo else '') }}" placeholder="0000000-00.0000.0.00.0000" required></div><div class="field"><label for="area">Área</label><select id="area" name="area" required>{% for value,label in [("civel","Cível"),("trabalhista","Trabalhista"),("previdenciario","Previdenciário")] %}<option value="{{ value }}" {% if valores and valores.area==value %}selected{% elif not valores and processo and processo.area==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="field"><label for="tribunal">Tribunal</label><input id="tribunal" name="tribunal" value="{{ valores.tribunal if valores else (processo.tribunal if processo else '') }}"></div><div class="field"><label for="tribunal_alias">Alias DataJud</label><input id="tribunal_alias" name="tribunal_alias" value="{{ valores.tribunal_alias if valores else (processo.tribunal_alias if processo else '') }}"></div><div class="field"><label for="fase">Fase</label><input id="fase" name="fase" value="{{ valores.fase if valores else (processo.fase if processo else '') }}"></div><div class="field"><label for="status">Status</label><select id="status" name="status" required>{% for value,label in [("ativo","Ativo"),("suspenso","Suspenso"),("arquivado","Arquivado")] %}<option value="{{ value }}" {% if valores and valores.status==value %}selected{% elif not valores and processo and processo.status==value %}selected{% elif not valores and not processo and value=="ativo" %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div class="detail-grid"><div class="field"><label for="valor_causa">Valor da causa</label><input id="valor_causa" name="valor_causa" type="number" min="0" step="0.01" value="{{ valores.valor_causa if valores else (processo.valor_causa if processo else '') }}"></div><div class="field"><label for="honorarios">Honorários</label><input id="honorarios" name="honorarios" type="number" min="0" step="0.01" value="{{ valores.honorarios if valores else (processo.honorarios if processo else '') }}"></div></div><div class="actions"><button type="submit">Salvar processo</button><a class="button secondary" href="{{ url_for('processos.detail',pk=processo.id) if processo else url_for('processos.list') }}">Cancelar</a></div></form></section></main></body></html>
