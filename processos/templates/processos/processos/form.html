<html><body><a href="{{ url_for('processo_detail',pk=processo.id) if processo else url_for('processo_list') }}">Voltar</a><h1>{{ titulo }}</h1><form method="post">{{ csrf_token() }}<p>Cliente<select name="cliente" required>{% for c in clientes %}<option value="{{ c.id }}" {% if processo and processo.cliente_id==c.id %}selected{% endif %}>{{ c.nome }}</option>{% endfor %}</select></p><p>Número CNJ<input name="numero_cnj" value="{{ processo.numero_cnj if processo else '' }}" required></p><p>Área<select name="area">{% for v,l in ProcessoAreaChoices %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></p><p>Tribunal<input name="tribunal" value="{{ processo.tribunal if processo else '' }}"></p><p>Alias DataJud<input name="tribunal_alias" value="{{ processo.tribunal_alias if processo else '' }}"></p><p>Fase<input name="fase" value="{{ processo.fase if processo else '' }}"></p><p>Status<select name="status">{% for v,l in ProcessStatusChoices %}<option value="{{ v }}" {% if processo and processo.status==v %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></p><p>Valor da causa<input name="valor_causa" type="number" step="0.01" value="{{ processo.valor_causa if processo else '' }}"></p><p>Honorários<input name="honorarios" type="number" step="0.01" value="{{ processo.honorarios if processo else '' }}"></p><button>Salvar</button></form></body></html>
