<html><body><a href="{{ url_for('dashboard') }}">Painel</a><h1>Processos</h1><a href="{{ url_for('processo_create') }}">+ Novo processo</a><form method="get"><input name="q" value="{{ busca }}" placeholder="CNJ, cliente ou tribunal"><select name="area"><option value="">Todas as áreas</option>{% for value,label in area_choices %}<option value="{{ value }}" {% if area==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><select name="status"><option value="">Todos os status</option>{% for value,label in status_choices %}<option value="{{ value }}" {% if status==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button>Filtrar</button></form>{% for processo in processos %}<p><a href="{{ url_for('processo_detail',pk=processo.id) }}">{{ processo.numero_cnj }}</a> — {{ processo.cliente.nome }} — {{ processo.area_display() }} — {{ processo.status_display() }} — {{ processo.tribunal or '—' }} | <a href="{{ url_for('processo_update',pk=processo.id) }}">Editar</a></p>{% else %}<p>Nenhum processo encontrado.</p>{% endfor %}</body></html>
