<html lang="pt-BR"><head><meta charset="utf-8"><title>{{ titulo }}</title></head><body><a href="{{ url_for('clientes.detail',pk=cliente.id) if cliente else url_for('clientes.list') }}">← Voltar</a><h1>{{ titulo }}</h1>{% with messages=get_flashed_messages() %}{% for message in messages %}<p>{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><p>Nome<br><input name="nome" value="{{ cliente.nome if cliente else '' }}" required></p><p>CPF/CNPJ<br><input name="cpf_cnpj" value="{{ cliente.cpf_cnpj if cliente else '' }}" required></p><p>Contato<br><input name="contato" value="{{ cliente.contato if cliente else '' }}"></p><p>Endereço<br><input name="endereco" value="{{ cliente.endereco if cliente else '' }}"></p><p>Observações<br><textarea name="observacoes">{{ cliente.observacoes if cliente else '' }}</textarea></p><button>Salvar</button></form></body></html>
