<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ titulo }}</title><link rel="stylesheet" href="{{ url_for('static', filename='processos/css/app.css') }}"></head><body><main class="page"><div class="topbar"><div><a class="back" href="{{ url_for('clientes.detail',pk=cliente.id) if cliente else url_for('clientes.list') }}">← Voltar</a><h1>{{ titulo }}</h1></div></div>{% with mensagens=get_flashed_messages(with_categories=true) %}{% for categoria,mensagem in mensagens %}<div class="alert {{ categoria }}">{{ mensagem }}</div>{% endfor %}{% endwith %}<section class="card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="nome">Nome</label><input id="nome" name="nome" value="{{ valores.nome if valores else (cliente.nome if cliente else '') }}" maxlength="200" required></div><div class="field"><label for="cpf_cnpj">CPF/CNPJ</label><input id="cpf_cnpj" name="cpf_cnpj" value="{{ valores.cpf_cnpj if valores else (cliente.cpf_cnpj if cliente else '') }}" inputmode="numeric" required></div><div class="field"><label for="contato">Contato</label><input id="contato" name="contato" value="{{ valores.contato if valores else (cliente.contato if cliente else '') }}" maxlength="100"></div><div class="field"><label for="endereco">Endereço</label><input id="endereco" name="endereco" value="{{ valores.endereco if valores else (cliente.endereco if cliente else '') }}" maxlength="300"></div><div class="field"><label for="observacoes">Observações</label><textarea id="observacoes" name="observacoes">{{ valores.observacoes if valores else (cliente.observacoes if cliente else '') }}</textarea></div><div class="actions"><button type="submit">Salvar cliente</button><a class="button secondary" href="{{ url_for('clientes.detail',pk=cliente.id) if cliente else url_for('clientes.list') }}">Cancelar</a></div></form></section></main></body></html>
