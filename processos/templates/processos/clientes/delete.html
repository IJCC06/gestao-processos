<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Excluir cliente</title><link rel="stylesheet" href="{{ url_for('static', filename='processos/css/app.css') }}"></head><body><main class="page"><section class="card confirm"><a class="back" href="{{ url_for('clientes.detail',pk=cliente.id) }}">← Voltar</a><h1>Excluir cliente</h1><p>Confirma a exclusão de <strong>{{ cliente.nome }}</strong>?</p>{% if cliente.processos %}<div class="alert error">Este cliente possui processos vinculados e não pode ser excluído.</div><a class="button secondary" href="{{ url_for('clientes.detail',pk=cliente.id) }}">Voltar para o cliente</a>{% else %}<p class="muted">Esta ação não poderá ser desfeita.</p><form method="post" class="actions"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="button danger" type="submit">Confirmar exclusão</button><a class="button secondary" href="{{ url_for('clientes.detail',pk=cliente.id) }}">Cancelar</a></form>{% endif %}</section></main></body></html>
