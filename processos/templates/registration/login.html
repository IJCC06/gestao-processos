<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar | Gestão de Processos</title><style>body{font-family:Arial,sans-serif;max-width:420px;margin:80px auto;padding:20px}form{display:grid;gap:12px}input{padding:10px;font-size:1rem}.erro{color:#a00}</style></head><body><h1>Gestão de Processos</h1><p>Entre com sua conta para acessar o sistema.</p>{% with messages=get_flashed_messages() %}{% for message in messages %}<p class="erro">{{ message }}</p>{% endfor %}{% endwith %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Usuário<input name="username" required></label><label>Senha<input type="password" name="password" required></label><button type="submit">Entrar</button></form></body></html>
