<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ codigo }} | Gestão de Processos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='processos/css/app.css') }}">
</head>
<body>
  <main class="page">
    <section class="error-page card">
      <p class="error-code">{{ codigo }}</p>
      <h1>{{ titulo }}</h1>
      <p class="error-message">{{ mensagem }}</p>
      <div class="actions">
        <a class="button" href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}">
          {{ "Voltar ao painel" if current_user.is_authenticated else "Ir para o login" }}
        </a>
        {% if current_user.is_authenticated %}
          <a class="button secondary" href="{{ url_for('auth.logout') }}">Sair</a>
        {% endif %}
      </div>
    </section>
  </main>
</body>
</html>
