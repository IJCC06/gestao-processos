{% extends "admin/base.html" %}
{% block title %}Redefinir senha | Administração{% endblock %}
{% block heading %}Redefinir senha{% endblock %}
{% block content %}
<div class="card admin-form-card">
  <p class="muted">Defina uma nova senha para <strong>{{ usuario.username }}</strong>.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-grid">
      <div class="field"><label for="password">Nova senha</label><input id="password" type="password" name="password" minlength="8" required autofocus></div>
      <div class="field"><label for="password_confirmation">Confirmar nova senha</label><input id="password_confirmation" type="password" name="password_confirmation" minlength="8" required></div>
    </div>
    <div class="form-actions"><button type="submit">Redefinir senha</button><a class="button secondary" href="{{ url_for('admin.usuarios') }}">Cancelar</a></div>
  </form>
</div>
{% endblock %}
