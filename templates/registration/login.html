<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Gestão de Processos</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 80px auto; padding: 20px; }
        form { display: grid; gap: 12px; }
        input { padding: 10px; font-size: 1rem; }
        button { padding: 10px; cursor: pointer; }
        .erro { color: #a00; }
    </style>
</head>
<body>
    <h1>Gestão de Processos</h1>
    <p>Entre com sua conta para acessar o sistema.</p>

    {% if form.errors %}
        <p class="erro">Usuário ou senha inválidos.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.username.label_tag }}
        {{ form.username }}
        {{ form.password.label_tag }}
        {{ form.password }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Entrar</button>
    </form>
</body>
</html>
